<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết quán</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FBF8F3] text-gray-800 p-6">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-3xl shadow-sm border border-amber-100">
    <a href="index.html" class="inline-block mb-4 text-amber-700 hover:underline">← Quay lại danh sách</a>
    
    <div id="detail-content">
      <!-- Nội dung chi tiết được nạp từ JS -->
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    // Lấy ID từ tham số URL (?id=...)
    const urlParams = new URLSearchParams(window.location.search);
    const cafeId = urlParams.get('id');
    const cafe = CAFE_DATA.find(item => item.id === cafeId);

    const container = document.getElementById('detail-content');

    if (cafe) {
      // URL Google Maps nhúng iframe
      const mapEmbedUrl = `https://maps.google.com/maps?q=${cafe.lat},${cafe.lng}&z=15&output=embed`;
      // URL điều hướng Google Maps trực tiếp
      const directMapUrl = `https://www.google.com/maps/dir/?api=1&destination=${cafe.lat},${cafe.lng}`;

      container.innerHTML = `
        <img src="${cafe.image}" class="w-full h-72 object-cover rounded-2xl mb-6" alt="${cafe.name}">
        <div class="flex justify-between items-center mb-2">
          <h1 class="text-2xl font-bold">${cafe.name}</h1>
          <span class="text-amber-500 font-bold text-lg">★ ${cafe.rating}</span>
        </div>
        <p class="text-gray-600 mb-4">${cafe.address}</p>
        <p class="text-gray-700 mb-6">${cafe.description}</p>

        <!-- Bản đồ Google Maps -->
        <div class="mt-6">
          <h2 class="text-xl font-bold mb-3">Vị trí trên bản đồ</h2>
          <div class="w-full h-80 rounded-2xl overflow-hidden border border-gray-200">
            <iframe 
              src="${mapEmbedUrl}" 
              width="100%" 
              height="100%" 
              style="border:0;" 
              allowfullscreen="" 
              loading="lazy">
            </iframe>
          </div>
          <div class="mt-4 text-right">
            <a href="${directMapUrl}" target="_blank" class="inline-block bg-amber-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-amber-700 transition">
               Định vị & Chỉ đường
            </a>
          </div>
        </div>
      `;
    } else {
      container.innerHTML = `<p class="text-red-500">Không tìm thấy thông tin quán.</p>`;
    }
  </script>
</body>
</html>
